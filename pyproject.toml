[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "detectability"
dynamic = ["version"]
description = 'Radar detectability product'
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = []
authors = [
  { name = "Jussi Tiira", email = "jussi.tiira@fmi.fi" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "numpy",
  "scipy",
  "xarray",
  "xradar>=0.13.0",
  "wradlib",
  "rioxarray",
  "rasterio",
  "pyproj",
  "h5py",
]

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "scipy-stubs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

# Dependencies without type information
[[tool.mypy.overrides]]
module = ["h5py", "rasterio.*", "wradlib.*", "xradar"]
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["detectability", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
detectability = ["src/detectability", "*/detectability/src/detectability"]
tests = ["tests", "*/detectability/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
