[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "radar-detectability"
dynamic = ["version"]
description = "Weather radar precipitation detectability (beam overshoot) products from echo-top data"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["weather radar", "detectability", "beam overshoot", "echo top", "meteorology", "ODIM"]
authors = [
  { name = "Jussi Tiira", email = "jussi.tiira@fmi.fi" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Typing :: Typed",
]
# Lower bounds are the oldest versions tested in CI (the first releases with
# Python 3.14 wheels where applicable).
dependencies = [
  "numpy>=2.3.2",
  "scipy>=1.16.1",
  "xarray>=2026.4.0",
  "xradar>=0.13.0",
  "wradlib>=2.5.0",
  "rioxarray>=0.19.0",
  "rasterio>=1.4.4",
  "pyproj>=3.7.2",
  "h5py>=3.15.0",
]

[project.urls]
Homepage = "https://github.com/fmidev/radar-detectability"
Source = "https://github.com/fmidev/radar-detectability"
Issues = "https://github.com/fmidev/radar-detectability/issues"
Changelog = "https://github.com/fmidev/radar-detectability/releases"

[tool.hatch.version]
source = "vcs"

# The import package name differs from the distribution name.
[tool.hatch.build.targets.wheel]
packages = ["src/detectability"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/detectability",
  "/tests",
  "/README.md",
  "/LICENSE.txt",
]
# Volume scan used only by src/scripts
exclude = ["/tests/data/*_volume_*.h5"]

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "scipy-stubs",
]

[tool.uv]
# Pin the build backend so wheels and container images build reproducibly.
build-constraint-dependencies = [
  "hatchling==1.33.0",
  "hatch-vcs==0.5.0",
  "setuptools-scm==10.3.4",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src/detectability", "tests"]
check_untyped_defs = true

[[tool.mypy.overrides]]
# The package ships py.typed, so its public annotations must be complete.
module = ["detectability.*"]
disallow_untyped_defs = true

# Dependencies without type information
[[tool.mypy.overrides]]
module = ["h5py", "rasterio.*", "wradlib.*", "xradar"]
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["detectability", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
detectability = ["src/detectability", "*/detectability/src/detectability"]
tests = ["tests", "*/detectability/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
